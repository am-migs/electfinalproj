name: PCB Manager build

on:
  pull_request:
    paths:
      - "pcb-inventory-manager/**"
      - ".github/workflows/pcb-manager-build.yml"
  push:
    branches:
      - main
      - feature/supabase-foundation
    paths:
      - "pcb-inventory-manager/**"
      - ".github/workflows/pcb-manager-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcb-inventory-manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pcb-inventory-manager/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
